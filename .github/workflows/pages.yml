# main に push すると、スマホ用のページ（GitHub Pages）を自動で更新する
name: スマホ用ページを更新
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: ゲームのファイルだけを集める
        run: |
          mkdir _site
          cp -r index.html robots.txt manifest.webmanifest src vendor img _site/
          # 新しい版をすぐ見せる：ファイル名に版の印をつけ、今の版を version.json に書く
          V=${GITHUB_SHA::7}
          sed -i "s/?v=dev/?v=$V/g; s/window.BUILD = 'dev'/window.BUILD = '$V'/" _site/index.html
          echo "{\"v\":\"$V\"}" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
